<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <!-- Background -->
  <rect width="500" height="500" fill="#141414"/>
  
  <!-- Splattered Grunge Circle -->
  <g fill="#e50914" opacity="0.95">
    <!-- Main rough ring structure -->
    <path d="M 250 45 C 310 45 420 90 440 180 C 455 245 440 340 380 410 C 330 470 200 465 130 435 C 75 410 45 320 48 240 C 50 170 95 75 180 50 C 205 43 228 45 250 45 Z M 250 55 C 220 55 185 62 160 74 C 95 105 62 180 60 250 C 58 315 88 390 140 415 C 200 445 320 445 370 395 C 420 345 435 255 422 190 C 405 110 315 55 250 55 Z" />
    
    <!-- Splatters and rough edges -->
    <path d="M 370 65 Q 380 55 395 70 Q 405 85 390 90 Z" />
    <path d="M 445 300 Q 460 320 440 335 Q 425 310 445 300 Z" />
    <path d="M 120 440 Q 100 455 95 430 Q 110 420 120 440 Z" />
    <path d="M 70 120 Q 55 100 80 95 Q 85 110 70 120 Z" />
    <path d="M 260 442 C 290 443 320 435 345 425 C 340 435 310 448 260 442 Z" />
    <path d="M 160 52 C 130 60 105 75 90 90 C 105 80 135 68 160 52 Z" />
  </g>

  <!-- Bloody Knife (Top Object) -->
  <g fill="#e50914" transform="translate(195, 100)">
    <!-- Blade and handle combined into a thematic silhouette angled downwards like the proto -->
    <path d="M 10 70 L 80 35 L 170 5 C 160 30 140 50 100 70 L 85 75 L 20 105 C 10 110 0 100 10 70 Z" />
    <!-- Handle screws / details -->
    <circle cx="35" cy="85" r="4" fill="#141414" />
    <circle cx="65" cy="70" r="4" fill="#141414" />
    <!-- Blood drips falling down from knife -->
    <path d="M 98 72 Q 98 90 95 95 Q 92 90 92 72 Z" />
    <circle cx="95" cy="104" r="5" />
    <circle cx="112" cy="88" r="3" />
  </g>

  <!-- Text "HORORTEST" (Center) -->
  <g fill="#ffffff" font-family="Impact, sans-serif" font-weight="bold" letter-spacing="4" text-anchor="middle">
    <!-- Customized stylized text layout replicating the geometric/sharp essence -->
    <text x="250" y="275" font-size="44">HORORTEST</text>
  </g>

  <!-- Gamepad / Controller (Bottom Object) -->
  <g fill="none" stroke="#e50914" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" transform="translate(175, 310)">
    <!-- Main Body Contour -->
    <path d="M 20 45 C 5 25 25 5 50 5 L 100 5 C 125 5 145 25 130 45 L 115 85 C 110 95 95 90 85 75 L 65 75 C 55 90 40 95 35 85 Z" fill="#141414" />
    <!-- D-Pad (Left Side) -->
    <path d="M 35 30 L 45 30 M 40 25 L 40 35" stroke-width="5" />
    <!-- Action Buttons (Right Side) -->
    <circle cx="100" cy="27" r="3" fill="#e50914" />
    <circle cx="112" cy="33" r="3" fill="#e50914" />
    <circle cx="100" cy="39" r="3" fill="#e50914" />
    <circle cx="88" cy="33" r="3" fill="#e50914" />
    <!-- Thumbsticks -->
    <circle cx="55" cy="50" r="10" stroke-width="4" />
    <circle cx="95" cy="50" r="10" stroke-width="4" />
  </g>
</svg>